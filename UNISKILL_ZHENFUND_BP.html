<html lang="zh-CN">

<style>

  /* Slides */
  #app{width:100%;height:100%;position:relative}

  .slide.active{opacity:1;pointer-events:all;z-index:1}
  .slide-inner{max-width:920px;width:100%}

  .slide-dark{background:linear-gradient(160deg,#080c16 0%,#0f172a 100%)}

  h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700;letter-spacing:-.02em;line-height:1.25}

  .small{font-size:.78rem;color:#64748b}
  .label{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#94a3b8;border:1px solid #334155;padding:4px 12px;border-radius:99px;margin-bottom:20px}

  .cover-dot{width:8px;height:8px;border-radius:50%;background:#60a5fa;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* Grid & Cards */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px}
  .card h3{font-size:.92rem;margin-bottom:6px;color:#e2e8f0}
  .card p,.card li{font-size:.82rem;color:#94a3b8;line-height:1.5}
  .card .icon{font-size:1.4rem;margin-bottom:10px;display:block}
  .card-blue{border-color:rgba(96,165,250,.25);background:rgba(96,165,250,.06)}
  .card-green{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.06)}
  .card-amber{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.06)}
  .card-purple{border-color:rgba(139,92,246,.25);background:rgba(139,92,246,.06)}

  table{width:100%;border-collapse:collapse;font-size:.83rem;margin-top:20px}
  th{text-align:left;padding:12px 14px;font-weight:600;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.1);font-size:.73rem;text-transform:uppercase;letter-spacing:.08em}

  tr:last-child td{border-bottom:none}
  .highlight-cell{color:#93c5fd;font-weight:600}

  .big-num{text-align:center}

  .big-num .num-label{font-size:.78rem;color:#94a3b8;margin-top:4px}

  .layer{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px}
  .layer-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#475569;width:64px;text-align:right;flex-shrink:0}
  .layer-items{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .chip{font-size:12px;color:#cbd5e1;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.18);border-radius:7px;padding:7px 14px;font-weight:500}

  .chip.green{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.2);color:#6ee7b7}
  .chip.amber{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.2);color:#fbbf24}
  .chip.cyan{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.16)}
  .chip.dashed{background:rgba(100,116,139,.06);border:1px dashed rgba(100,116,139,.25);color:#64748b}
  .connector{display:flex;align-items:center;padding:0 0 0 76px;height:26px}
  .connector-line{width:2px;height:100%;background:linear-gradient(180deg,#60a5fa,#8b5cf6);margin-left:52px}
  .connector-label{font-size:9px;color:#475569;margin-left:10px;letter-spacing:.04em}

  /* Timeline */
  .timeline{display:flex;gap:0;margin-top:24px;justify-content:center}
  .timeline-item{flex:1;text-align:center;position:relative;padding:16px 10px 0;border-top:2px solid #334155;max-width:170px}
  .timeline-item.active{border-top-color:#60a5fa}
  .timeline-item .year{font-weight:700;color:#60a5fa;margin-bottom:4px;font-size:.9rem}
  .timeline-item .desc{font-size:.75rem;color:#94a3b8;line-height:1.4}
  .timeline-item .marker{width:10px;height:10px;border-radius:50%;background:#334155;position:absolute;top:-6px;left:50%;transform:translateX(-50%)}
  .timeline-item.active .marker{background:#60a5fa;box-shadow:0 0 10px rgba(96,165,250,.4)}

  /* Nav */
  .nav-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:100;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);padding:7px 14px;border-radius:99px}
  .nav-btn{background:none;border:none;color:#94a3b8;cursor:pointer;padding:5px 8px;border-radius:7px;font-size:.9rem;transition:all .2s}
  .nav-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
  .slide-counter{font-size:.73rem;color:#64748b;min-width:60px;text-align:center}
  .progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#60a5fa,#8b5cf6,#06b6d4);z-index:101;transition:width .5s}

  }
  @media print{
    .slide{position:relative;page-break-after:always;opacity:1;pointer-events:all;min-height:100vh}
    .nav-bar,.progress{display:none}
  }
</style>
</head>

// Render
let current = 0;
const app = document.getElementById('app');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');

function renderAll() {
  app.innerHTML = slides.map((s,i) =>
    '<div class="slide '+s.cls+(i===current?' active':'')+'">'+s.html+'</div>'
  ).join('');
  updateUI();
}

function updateUI() {
  document.querySelectorAll('.slide').forEach((s,i) => s.classList.toggle('active', i===current));
  progress.style.width = ((current+1)/slides.length*100)+'%';
  counter.textContent = (current+1)+' / '+slides.length;
}

function next() { if(current<slides.length-1){current++;updateUI()} }
function prev() { if(current>0){current--;updateUI()} }

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') { e.preventDefault(); next() }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); prev() }
});

renderAll();
</script>
</body>
</html>
