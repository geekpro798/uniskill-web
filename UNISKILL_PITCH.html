<title>UniSkill — AI Agent 的技能基础设施</title>
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#080c16;color:#e2e8f0;overflow:hidden;width:100vw;height:100vh}
a{color:#60a5fa;text-decoration:none}

/* ========== PRESENTATION CONTAINER ========== */
#app{width:100%;height:100%;position:relative}

/* ========== SLIDE ========== */
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .5s ease;pointer-events:none;padding:60px 80px}
.slide.active{opacity:1;pointer-events:all;z-index:1}
.slide-inner{max-width:1000px;width:100%}

/* ========== SLIDE VARIANTS ========== */
.slide-cover{background:linear-gradient(135deg,#080c16 0%,#0f172a 40%,#1e1040 70%,#0c1622 100%)}
.slide-dark{background:linear-gradient(160deg,#080c16 0%,#0f172a 100%)}
.slide-light{background:linear-gradient(160deg,#f8fafc 0%,#e2e8f0 100%);color:#0f172a}
.slide-accent{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 60%,#1a1040 100%)}
.slide-diagram{background:linear-gradient(160deg,#080c16 0%,#0f172a 50%,#0c1622 100%);padding:16px 12px}

.slide-light .muted{color:#64748b}
.slide-light .label{color:#475569;border-color:#cbd5e1}
.slide-light .card{background:#fff;border-color:#e2e8f0}

/* ========== TYPOGRAPHY ========== */
h1{font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800;letter-spacing:-0.03em;line-height:1.15}
h2{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:700;letter-spacing:-0.02em;line-height:1.25}
h3{font-size:1.15rem;font-weight:600;letter-spacing:-0.01em}
.subtitle{font-size:1.2rem;color:#94a3b8;font-weight:400;margin-top:0.4em}
.muted{color:#94a3b8;font-size:0.95rem;line-height:1.6}
.small{font-size:0.8rem;color:#64748b}
.label{display:inline-block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#94a3b8;border:1px solid #334155;padding:4px 12px;border-radius:99px;margin-bottom:24px}

/* ========== GRADIENT TEXT ========== */
.gradient-text{background:linear-gradient(135deg,#60a5fa,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ========== COVER SLIDE ========== */
.cover-content{text-align:center}
.cover-content h1{margin-bottom:0.25em}
.cover-content .subtitle{font-size:1.3rem;margin-bottom:0.6em}
.cover-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.2);padding:8px 20px;border-radius:99px;font-size:0.85rem;font-weight:500;color:#93c5fd;margin-top:32px}
.cover-dot{width:8px;height:8px;border-radius:50%;background:#60a5fa;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ========== LOGO ========== */
.logo-mark{margin-bottom:28px}

/* ========== GRID & CARDS ========== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:32px}
.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;transition:border-color .3s}
.card:hover{border-color:rgba(96,165,250,.3)}
.card h3{font-size:0.95rem;margin-bottom:6px;color:#e2e8f0}
.card p,.card li{font-size:0.85rem;color:#94a3b8;line-height:1.55}
.card .icon{font-size:1.5rem;margin-bottom:12px;display:block}
.card-accent{border-color:rgba(96,165,250,.25);background:rgba(96,165,250,.06)}
.card-green{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.06)}
.card-amber{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.06)}
.card-purple{border-color:rgba(139,92,246,.25);background:rgba(139,92,246,.06)}
.card-rose{border-color:rgba(244,63,114,.25);background:rgba(244,63,114,.06)}

/* ========== DIAGRAM ========== */
.diagram{display:flex;align-items:center;justify-content:center;gap:16px;margin:32px 0;font-size:0.85rem;flex-wrap:wrap}
.diagram-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px 20px;text-align:center;font-weight:600;white-space:nowrap}
.diagram-box.highlight{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.35);color:#93c5fd}
.diagram-arrow{font-size:1.5rem;color:#475569}
.flow-row{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0}
.flow-step{text-align:center;flex:0 0 auto}
.flow-step .step-num{width:40px;height:40px;border-radius:50%;background:rgba(96,165,250,.15);border:2px solid rgba(96,165,250,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:700;font-size:0.9rem;color:#93c5fd}
.flow-step .step-label{font-size:0.75rem;color:#94a3b8}

/* ========== SVG DIAGRAM SLIDES ========== */
.svg-diagram-wrap{width:100%;display:flex;align-items:center;justify-content:center}
.svg-diagram-wrap svg{width:100%;height:auto;max-height:82vh}

/* ========== LISTS ========== */
.list{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.list-item{display:flex;align-items:flex-start;gap:14px;font-size:0.95rem;line-height:1.5}
.list-icon{flex-shrink:0;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem}
.list-icon.blue{background:rgba(96,165,250,.15);color:#60a5fa}
.list-icon.green{background:rgba(16,185,129,.15);color:#10b981}
.list-icon.amber{background:rgba(245,158,11,.15);color:#f59e0b}
.list-icon.red{background:rgba(239,68,68,.15);color:#ef4444}

/* ========== TABLE ========== */
.table-wrap{overflow-x:auto;margin-top:28px}
table{width:100%;border-collapse:collapse;font-size:0.85rem}
th{text-align:left;padding:12px 16px;font-weight:600;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.1);font-size:0.75rem;text-transform:uppercase;letter-spacing:.08em}
td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);color:#cbd5e1}
tr:last-child td{border-bottom:none}
td.highlight-cell{color:#93c5fd;font-weight:600}
.check{color:#10b981;font-weight:700}
.cross{color:#ef4444}

/* ========== NUMBERED BIG ========== */
.big-numbers{display:flex;gap:32px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.big-num{text-align:center}
.big-num .num{font-size:3rem;font-weight:800;background:linear-gradient(135deg,#60a5fa,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.big-num .num-label{font-size:0.8rem;color:#94a3b8;margin-top:4px}

/* ========== QUOTE ========== */
blockquote{border-left:4px solid #60a5fa;padding:16px 24px;margin-top:24px;background:rgba(96,165,250,.06);border-radius:0 12px 12px 0;font-size:1.1rem;color:#cbd5e1;font-style:italic;line-height:1.6}

/* ========== TIMELINE ========== */
.timeline{display:flex;gap:0;margin-top:36px;justify-content:center}
.timeline-item{flex:1;text-align:center;position:relative;padding:20px 16px 0;border-top:2px solid #334155;max-width:200px}
.timeline-item.active{border-top-color:#60a5fa}
.timeline-item .year{font-weight:700;color:#60a5fa;margin-bottom:6px}
.timeline-item .desc{font-size:0.8rem;color:#94a3b8;line-height:1.4}
.timeline-item .marker{width:12px;height:12px;border-radius:50%;background:#334155;position:absolute;top:-7px;left:50%;transform:translateX(-50%)}
.timeline-item.active .marker{background:#60a5fa;box-shadow:0 0 12px rgba(96,165,250,.4)}

/* ========== NAVIGATION ========== */
.nav-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:100;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);padding:8px 16px;border-radius:99px}
.nav-btn{background:none;border:none;color:#94a3b8;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:1rem;transition:all .2s}
.nav-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.slide-counter{font-size:0.75rem;color:#64748b;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}

/* ========== PROGRESS BAR ========== */
.progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#60a5fa,#8b5cf6,#06b6d4);z-index:101;transition:width .5s ease}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  .slide{padding:40px 24px}
  .slide-diagram{padding:16px 8px}
  h1{font-size:1.8rem}
  h2{font-size:1.3rem}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .diagram{flex-direction:column}
  .big-numbers{gap:20px}
  .flow-row{gap:8px}
}

@media print{
  .slide{position:relative;page-break-after:always;opacity:1;pointer-events:all;min-height:100vh}
  .nav-bar,.progress{display:none}
}
</style>
</head>

// ========== RENDER ==========
let current = 0;
const app = document.getElementById('app');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');

function renderAll() {
  app.innerHTML = slides.map((s,i) =>
    `<div class="slide ${s.cls}${i===current?' active':''}">${s.html}</div>`
  ).join('');
  updateUI();
}

function updateUI() {
  progress.style.width = ((current+1)/slides.length*100)+'%';
  counter.textContent = `${current+1} / ${slides.length}`;
  const allSlides = app.querySelectorAll('.slide');
  allSlides.forEach((s,i) => s.classList.toggle('active', i===current));
}

function next() { if(current < slides.length-1) { current++; updateUI(); } }
function prev() { if(current > 0) { current--; updateUI(); } }

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='ArrowDown') next();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') prev();
});

let touchX = 0;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx < -50) next();
  if(dx > 50) prev();
});

renderAll();
</script>
